html {

body {

a {

button {

.site-nav {

}

.site-nav__source:hover {

.hero__media {

.hero__media img {

.hero__veil {

.hero__copy {

.brand-mark {

}

.hero h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 7vw, 4.6rem);

  line-height: 0.98;

}

.hero__sub {
  margin: 1rem 0 0;

  line-height: 1.5;

}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;

}

.primary-btn,

.ghost-btn {

  padding: 0.8rem 1.2rem;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.primary-btn {
  background: var(--sun);
  color: var(--ink);
  font-weight: 700;
}

.primary-btn:hover {

}

.secondary-btn {

  font-weight: 600;
}

.secondary-btn:hover {

}

.hero__credit {
  margin: 1.25rem 0 0;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.72);
}

.planner {

  margin: 0 auto;
  padding: 2.5rem 0 4rem;
}

.planner__intro {
  max-width: 38rem;
  margin-bottom: 1.5rem;
  animation: rise 0.7s ease 0.1s both;
}

.eyebrow {
  margin: 0 0 0.4rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--sea-mid);
}

.planner__intro h2,
.overview__head h2,
.section-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;

.planner__intro h2 {

}

.planner__intro p,
.overview__head p,

  line-height: 1.55;
}

.day-strip-wrap {

.day-strip {
  display: flex;
  gap: 0.6rem;
  overflow-x: auto;
  padding: 0.25rem 0.25rem 0.55rem;

  scrollbar-width: thin;
}

.day-chip {
  flex: 0 0 auto;

  width: min(190px, 72vw);
  text-align: left;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 16px;
  padding: 0.85rem 0.95rem;

  transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.day-chip:hover {
  transform: translateY(-2px);
  border-color: rgba(20, 98, 119, 0.35);
}

.day-chip.is-active {
  border-color: transparent;
  background: linear-gradient(160deg, var(--sea) 0%, var(--sea-mid) 100%);

  box-shadow: var(--shadow);
}

.day-chip__date {

  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;

  margin-bottom: 0.25rem;
}

.day-chip__title {
  display: block;
  font-weight: 600;
  line-height: 1.25;
}

.day-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  padding: clamp(1.2rem, 3vw, 2rem);
  box-shadow: var(--shadow);
  animation: rise 0.45s ease both;
}

.day-panel__header h2 {

  line-height: 1.05;
}

.day-location {

  margin: 0.75rem 0 0;
  padding: 0.35rem 0.7rem;

  font-weight: 600;

.day-panel__nav {

.ghost-btn:disabled {

.stay-card__meta,

.stay-facts {

.stay-facts div {

  gap: 0.15rem;

.stay-facts dt {

.stay-facts dd {

  line-height: 1.4;

.text-link {

.text-link:hover {

.day-links ul {

  padding: 0;

.day-links a {
  display: inline-flex;
  text-decoration: none;
  font-weight: 600;

.day-links a:hover {
  border-color: var(--sea-mid);

.overview__head {
  margin-bottom: 0.85rem;

.overview-table {
  display: grid;
  gap: 0.55rem;

.overview-row {

  display: grid;
  grid-template-columns: 8.5rem 1fr;
  gap: 0.85rem;
  text-align: left;
  border: 1px solid var(--line);

  border-radius: 14px;
  padding: 0.95rem 1rem;
  cursor: pointer;

.overview-row:hover {
  transform: translateY(-1px);
  border-color: rgba(20, 98, 119, 0.35);
}

.overview-row.is-active {
  border-color: transparent;
  background: linear-gradient(135deg, rgba(126, 200, 212, 0.35), rgba(232, 184, 109, 0.22));

.overview-row__when,
.overview-row__what {
  display: grid;
  gap: 0.2rem;

.overview-row strong {
  font-weight: 700;
}

.overview-row span span,
.overview-row__when span,
.overview-row__what span {
  color: var(--ink-soft);
  font-size: 0.92rem;

.site-footer {
  width: min(1100px, calc(100% - 2rem));

  color: var(--ink-soft);
  line-height: 1.5;

.travelers {
  font-weight: 600;
  color: var(--sea);

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);

  to {

    transform: translateY(0);
  }
}

@keyframes drift {
  from {
    transform: scale(1.04) translate3d(0, 0, 0);
  }
  to {
    transform: scale(1.08) translate3d(-1.5%, -1%, 0);
  }
}

@media (max-width: 640px) {
  .overview-row {
    grid-template-columns: 1fr;
    gap: 0.35rem;
  }

  .day-panel__nav {
    flex-wrap: wrap;
    justify-content: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .hero__media img,
  .hero__copy,
  .planner__intro,
  .day-panel,
  .day-chip,
  .overview-row,
  .primary-btn {
    animation: none !important;
    transition: none !important;
  }
}

const stayById = Object.fromEntries(
  Object.values(stays).map((stay) => [stay.id, stay]),
)

const overview = days.map((day) => ({
  id: day.id,
  weekday: day.weekday,
  shortLabel: day.shortLabel,
  title: day.title,
  location: day.location,
}))

const params = new URLSearchParams(window.location.search)
const initialId = params.get('day')
const initialIndex = Math.max(
  0,
  days.findIndex((day) => day.id === initialId),
)

let selectedIndex = initialIndex === -1 ? 0 : initialIndex

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
}

function typeLabel(type) {
  const labels = {
    arrive: 'Arrival',
    depart: 'Departure',
    transit: 'Getting there',
    booked: 'Booked / priced',
    plan: 'The plan',
    stay: 'Stay',
    idea: 'Idea',
    note: 'Note',
  }
  return labels[type] || 'Note'
}

function renderStayCard(stay) {
  return `
    <article class="stay-card">
      <div class="stay-card__top">
        <p class="eyebrow">${escapeHtml(stay.place)} stay</p>
        <h3>${escapeHtml(stay.name)}</h3>
        <p class="stay-card__meta">${escapeHtml(stay.guests)} · ${escapeHtml(stay.nights)}</p>
      </div>
      <dl class="stay-facts">
        <div><dt>Confirmation</dt><dd>${escapeHtml(stay.confirmation)}</dd></div>
        <div><dt>Address</dt><dd>${escapeHtml(stay.address)}</dd></div>
        <div><dt>Room</dt><dd>${escapeHtml(stay.room)}</dd></div>
        <div><dt>Check-in / out</dt><dd>${escapeHtml(stay.checkIn)} · ${escapeHtml(stay.checkOut)}</dd></div>
      </dl>
      <p class="stay-card__notes">${escapeHtml(stay.notes)}</p>
      <a class="text-link" href="${escapeHtml(stay.mapsUrl)}" target="_blank" rel="noopener">Open in Maps</a>
    </article>
  `
}

function renderDay(day, index) {
  const dayStays = day.stayIds.map((id) => stayById[id]).filter(Boolean)
  const prev = days[index - 1]
  const next = days[index + 1]

  return `
    <article class="day-panel" id="day-panel" aria-live="polite">
      <header class="day-panel__header">
        <p class="eyebrow">${escapeHtml(day.weekday)} · ${escapeHtml(day.shortLabel)}</p>
        <h2>${escapeHtml(day.title)}</h2>
        <p class="lede">${escapeHtml(day.summary)}</p>
        <p class="day-location">${escapeHtml(day.location)}</p>
      </header>

      <div class="day-panel__nav">
        <button type="button" class="ghost-btn" data-goto="${prev ? index - 1 : ''}" ${prev ? '' : 'disabled'}>
          ← ${prev ? escapeHtml(prev.shortLabel) : 'Start'}
        </button>
        <span>${index + 1} / ${days.length}</span>
        <button type="button" class="ghost-btn" data-goto="${next ? index + 1 : ''}" ${next ? '' : 'disabled'}>
          ${next ? escapeHtml(next.shortLabel) : 'End'} →
        </button>
      </div>

      <section class="block-stack" aria-label="Day plan">
        ${day.blocks
          .map(
            (block) => `
          <div class="plan-block plan-block--${escapeHtml(block.type)}">
            <p class="plan-block__type">${escapeHtml(typeLabel(block.type))}</p>
            <h3>${escapeHtml(block.title)}</h3>
            <p>${escapeHtml(block.body)}</p>
          </div>
        `,
          )
          .join('')}
      </section>

      <section class="stays" aria-label="Where you sleep">
        <h3 class="section-title">Where you sleep</h3>
        <div class="stay-grid">
          ${dayStays.map(renderStayCard).join('')}
        </div>
      </section>

      <section class="day-links" aria-label="Useful links">
        <h3 class="section-title">Links</h3>
        <ul>
          ${day.links
            .map(
              (link) => `
            <li>
              <a href="${escapeHtml(link.href)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a>
            </li>
          `,
            )
            .join('')}
        </ul>
      </section>
    </article>
  `
}

function renderApp() {
  const day = days[selectedIndex]

  document.querySelector('#app').innerHTML = `
    <a class="skip-link" href="#day-panel">Skip to selected day</a>

    <header class="site-nav">

      <div class="day-strip-wrap">

          ${days

            <button
              type="button"
              class="day-chip ${index === selectedIndex ? 'is-active' : ''}"
              role="tab"
              aria-selected="${index === selectedIndex}"
              data-select="${index}"
              id="day-chip-${index}"
            >
              <span class="day-chip__date">${escapeHtml(item.shortLabel)}</span>
              <span class="day-chip__title">${escapeHtml(item.title)}</span>
            </button>
          `,
            )
            .join('')}
        </div>
      </div>

      ${renderDay(day, selectedIndex)}

      <section class="overview" aria-label="Itinerary overview">
        <div class="overview__head">
          <h2>Overview</h2>
          <p>Tap any row to jump straight to that day.</p>
        </div>
        <div class="overview-table" role="list">
          ${overview
            .map(
              (row, index) => `
            <button type="button" class="overview-row ${index === selectedIndex ? 'is-active' : ''}" data-select="${index}" role="listitem">
              <span class="overview-row__when">
                <strong>${escapeHtml(row.weekday)}</strong>
                <span>${escapeHtml(row.shortLabel)}</span>
              </span>
              <span class="overview-row__what">
                <strong>${escapeHtml(row.title)}</strong>
                <span>${escapeHtml(row.location)}</span>
              </span>
            </button>
          `,
            )
            .join('')}
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Day-first viewer for the Fora trip curated by
        <a href="mailto:${escapeHtml(trip.curator.email)}">${escapeHtml(trip.curator.name)}</a>.
        Booking confirmations stay on Fora.
      </p>
      <p class="travelers">${trip.travelers.map(escapeHtml).join(' · ')}</p>
    </footer>
  `

  bindEvents()
  syncUrl()
  scrollActiveChipIntoView()
}

function syncUrl() {
  const day = days[selectedIndex]
  const url = new URL(window.location.href)
  url.searchParams.set('day', day.id)
  window.history.replaceState({}, '', url)
}

function scrollActiveChipIntoView() {
  const active = document.querySelector('.day-chip.is-active')
  if (active) {
    active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' })
  }
}

function selectDay(index, { scrollToPanel = true } = {}) {
  if (index < 0 || index >= days.length || index === selectedIndex) {
    if (index === selectedIndex && scrollToPanel) {
      document.getElementById('day-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }
    return
  }
  selectedIndex = index
  renderApp()
  if (scrollToPanel) {
    requestAnimationFrame(() => {
      document.getElementById('day-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    })
  }
}

function bindEvents() {
  document.querySelectorAll('[data-select]').forEach((el) => {
    el.addEventListener('click', () => {
      selectDay(Number(el.getAttribute('data-select')))
    })
  })

  document.querySelectorAll('[data-goto]').forEach((el) => {
    el.addEventListener('click', () => {
      const value = el.getAttribute('data-goto')
      if (value === '') return
      selectDay(Number(value))
    })
  })
}

window.addEventListener('keydown', (event) => {
  if (event.target.matches('input, textarea, select, [contenteditable="true"]')) return
  if (event.key === 'ArrowLeft') {
    event.preventDefault()
    selectDay(selectedIndex - 1)
  }
  if (event.key === 'ArrowRight') {
    event.preventDefault()
    selectDay(selectedIndex + 1)
  }
})

renderApp()
    </script>
